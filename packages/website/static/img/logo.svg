<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="frameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FE4FF"></stop>
      <stop offset="100%" stop-color="#1677FF"></stop>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="35" y="35" width="430" height="330" rx="40" stroke="url(#frameGradient)" stroke-width="26" fill="none"></rect>

  <!-- Top-right dot -->
  <circle cx="380" cy="95" r="18" fill="#2FE4FF"></circle>

  <!-- Bottom dots (centered, full width) -->
  <circle cx="250" cy="290" r="18" fill="#2FE4FF"></circle> <!-- center -->
  <circle cx="120" cy="290" r="18" fill="#2FE4FF"></circle> <!-- left -->
  <circle cx="380" cy="290" r="18" fill="#2FE4FF"></circle> <!-- right (aligned) -->

</svg>
